[project]
name = "objhist-assistant"
version = "0.1.0"
description = "Natural-language questions answered from the recorded object history."
requires-python = ">=3.12,<3.14"
dependencies = ["objhist-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/objhist_assistant"]

[tool.uv.sources]
objhist-core = { workspace = true }
