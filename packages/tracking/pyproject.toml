[project]
name = "objhist-tracking"
version = "0.1.0"
description = "Object identity association across frames and the object history log."
requires-python = ">=3.12,<3.14"
dependencies = ["objhist-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/objhist_tracking"]

[tool.uv.sources]
objhist-core = { workspace = true }
