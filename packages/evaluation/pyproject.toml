[project]
name = "objhist-evaluation"
version = "0.1.0"
description = "Scripted kitchen scenarios and precision/recall evaluation of history events."
requires-python = ">=3.12,<3.14"
dependencies = ["objhist-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/objhist_evaluation"]

[tool.uv.sources]
objhist-core = { workspace = true }
