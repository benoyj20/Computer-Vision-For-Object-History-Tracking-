[project]
name = "objhist-core"
version = "0.1.0"
description = "Shared data contracts between detection, tracking, assistant, and evaluation."
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/objhist_core"]
